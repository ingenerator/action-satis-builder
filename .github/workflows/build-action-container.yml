on: [ push ]

env:
  IMAGE_NAME: action-satis-builder

jobs:
  build-image:
    runs-on: ubuntu-latest
    name: Build action image
    permissions:
      # This sets an explicit list of restrictive permissions for the GH_TOKEN that will be issued, it still doesn't
      # guarantee that it's safe to use third-party actions (they'd still be able to do anything we're meant to do)
      # but it at least restricts the privilege scope
      contents: read
      packages: write
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:v2

      - name: Checkout
        uses: actions/checkout@v2

      - name: Composer install
        uses: ingenerator/github-composite-actions/cached-composer-install@v1

      - name: Build image
        run: docker build . --file Dockerfile --tag $IMAGE_NAME
        
      - name: Check composer platform requirements
        uses: ingenerator/github-composite-actions/check-docker-composer-platform@v1
        with:
          image: ${{ env.IMAGE_NAME }}

      - name: Test image
        run: |
          set -o errexit
          set -o nounset

          docker run \
            -v $PWD/test/workdir:/ghworkspace \
            -e CACHE_DIR='_my-cache' \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_WORKSPACE="/ghworkspace" \
            -w /ghworkspace \
            $IMAGE_NAME

          php -d zend.assertions=1 test/verify-built-repo.php

      - name: Push image to GitHub Container Registry
        run: |
          set -o errexit
          set -o nounset

          # Login to Github registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login https://ghcr.io -u ${{ github.actor }} --password-stdin

          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME
          # Change all uppercase to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          # Strip git ref prefix from version
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          # Strip "v" prefix from tag name
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')

          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          docker tag $IMAGE_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
